version: 1
disable_existing_loggers: false

# Define how your logs look
formatters:
  default:
    "()": uvicorn.logging.DefaultFormatter
    fmt: "%(asctime)s - %(levelprefix)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors: true
  access:
    "()": uvicorn.logging.AccessFormatter
    fmt: "%(asctime)s - %(levelprefix)s %(client_addr)s - '%(request_line)s' %(status_code)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors: true

# Define where logs go (the terminal streams)
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout

# Connect the loggers to the handlers
loggers:
  uvicorn:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.error:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.access:
    handlers: [access]
    level: INFO
    propagate: false
