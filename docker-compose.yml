services:
  # 1. OpenTelemetry Collector (Unified Data Collection)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: poly_spike_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver (FastAPI connects here)
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      jaeger:
        condition: service_healthy
      tempo:
        condition: service_healthy
    restart: always

  # 2. QDrant (Vector DB)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: poly_spike_qdrant_local
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  # 3. Grafana Dashboard UI
  grafana:
    image: grafana/grafana:latest
    container_name: poly_spike_grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - loki
      - tempo
      - prometheus
      - jaeger
    restart: always

  # 4. Loki (Log Aggregation)
  loki:
    image: grafana/loki:latest
    container_name: poly_spike_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # 5. Tempo (Distributed Tracing / Replaces Jaeger)
  tempo:
    image: grafana/tempo:latest
    container_name: poly_spike_tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      # - "4317:4317" # OTLP gRPC receiver either otel collector or this only one should listen at this port
      - "3200:3200" # Tempo UI/API
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3200"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 6. Prometheus (Metrics Engine)
  prometheus:
    image: prom/prometheus:latest
    container_name: poly_spike_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    restart: always

  # 7. Jaeger (Tracing Engine)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: poly_spike_jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "14268:14268" # HTTP collector
      - "14250:14250" # gRPC receiver for internal OTel ingestion
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "14250"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 8. Arize Phoenix (Open Source LLM Observability)
  # phoenix:
  #   image: arizephoenix/phoenix:latest
  #   container_name: poly_spike_phoenix
  #   ports:
  #     - "6006:6006" # Phoenix UI
  #     # We do NOT expose 4317 to the host to avoid clashing with your OTel collector.
  #     # The collector will reach Phoenix natively inside the Docker network.
  #   restart: always
  # Refer https://gemini.google.com/app/403eb9c6b8bb0496
