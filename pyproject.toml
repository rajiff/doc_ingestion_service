[project]
name = "doc-ingestion-service"
version = "0.1.0"
description = "FastAPI microservice for dynamic document ingestion and text extraction"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.141.1",
    "fit>=0.5.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pylint.main]
# Specify the files or directories to lint
ignore = ["tests", "scripts"]

[tool.pylint.messages_control]
# Disable specific lint errors if needed
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
]

[tool.pylint.format]
max-line-length = 88