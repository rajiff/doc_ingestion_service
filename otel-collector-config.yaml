receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Exporter 1: Push to Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Exporter 2: Push to Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # # NEW: Arize Phoenix via gRPC
  # otlp/phoenix:
  #   endpoint: phoenix:4317
  #   tls:
  #     insecure: true

  # # NEW: Langfuse via HTTP
  # otlphttp/langfuse:
  #   traces_endpoint: http://langfuse:3000/api/public/otel/v1/traces
  #   headers:
  #     # You will replace the placeholder below after setting up Langfuse
  #     Authorization: "Basic <YOUR_BASE64_ENCODED_KEYS>"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlp/tempo]  # Sends to BOTH in parallel!
      # exporters: [otlp/jaeger, otlp/tempo, otlp/phoenix, otlphttp/langfuse]
