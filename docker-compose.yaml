
services:
  # 1. QDrant (Vector DB)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: poly_spike_qdrant_local
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  # 2. Grafana Dashboard UI
  grafana:
    image: grafana/grafana:latest
    container_name: poly_spike_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - loki
      - tempo
      - prometheus
      - jaeger

  # 3. Loki (Log Aggregation)
  loki:
    image: grafana/loki:latest
    container_name: poly_spike_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # 4. Tempo (Distributed Tracing / Replaces Jaeger)
  tempo:
    image: grafana/tempo:latest
    container_name: poly_spike_tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "3200:3200" # Tempo UI/API

  # 5. Prometheus (Metrics Engine)
  prometheus:
    image: prom/prometheus:latest
    container_name: poly_spike_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml

  # 6. OpenTelemetry Collector (Unified Data Collection)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: poly_spike_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver (FastAPI connects here)
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - jaeger
      - tempo

  # 7. Jaeger (Tracing Engine)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: poly_spike_jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "14268:14268" # HTTP collector
      - "14250:14250" # gRPC receiver for internal OTel ingestion
    environment:
      - COLLECTOR_OTLP_ENABLED=true